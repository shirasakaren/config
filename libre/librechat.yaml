version: 1.3.13

cache: true

endpoints:
  custom:
    - name: "Claude"

      # Use native Anthropic Messages API
      provider: "anthropic"

      # Stored securely in Railway
      apiKey: "${DEEPSEEK_API_KEY}"

      # DeepSeek's Anthropic-compatible API
      baseURL: "https://api.deepseek.com/anthropic"

      headers:
        anthropic-version: "2023-06-01"

      models:
        default:
          - "deepseek-v4-pro"
          - "deepseek-v4-flash"
        fetch: false

      # Use Flash for cheap/fast conversation-title generation
      titleConvo: true
      titleModel: "deepseek-v4-flash"

      modelDisplayLabel: "Claude"


# Present only one curated model to the user.
# Internally this sends deepseek-v4-pro.
modelSpecs:
  enforce: true
  prioritize: true

  list:
    - name: "claude"
      label: "Claude"
      default: true

      preset:
        endpoint: "Claude"
        model: "deepseek-v4-pro"

        # Equivalent to your CLAUDE_CODE_EFFORT_LEVEL=max
        effort: "max"
